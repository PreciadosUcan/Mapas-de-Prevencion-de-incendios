<!DOCTYPE html>
<html>
<head>
  <title>Incendios</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
 
<body>
<div id="map" style="height: 100vh;"></div>

<script>

var map = L.map('map').setView([42.82, -1.64], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OSM'
}).addTo(map);

// colores
const colores = {
  'Permitidas': 'green',
  'Permitidas condicional': 'yellow',
  'Permitidas condicional estricta': 'orange',
  'Prohibidas completamente': 'red'
};

// cargar geojson 
fetch('https://raw.githubusercontent.com/PreciadosUcan/Mapas-de-Prevencion-de-incendios/main/data/processed/incendios_wgs84.geojson')
  .then(r => r.json())
  .then(data => {

    L.geoJSON(data, {
      style: function(feature) {
        return {
          color: 'black',
          weight: 0.5,
          fillColor: colores[feature.properties.Labores] || 'gray',
          fillOpacity: 0.7
        };
      },

      onEachFeature: function(feature, layer) {
        layer.bindPopup(
            `<div style="font-size:30px;">
                <div style="font-size:28px; font-weight:bold;">
                  ${feature.properties.Municipio}
                </div>
          
                <div style="margin-top:10px;">
                  <b>Labores:</b> ${feature.properties.Labores}
                </div>
          
                <div style="margin-top:10px;">
                  <b>Condiciones:</b>
                  <a href="https://www.navarra.es/es/prevencion-de-incendios-forestales" target="_blank">
                    ver condiciones
                  </a>
                </div>
          
                <div style="margin-top:10px;">
                  <b>Última actualización:</b> ${feature.properties.Fecha}
                </div>
             </div>`
        );
      }

    }).addTo(map);

  });

</script>

</body>
</html>
