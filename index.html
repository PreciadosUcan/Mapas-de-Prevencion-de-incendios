<script>
var map = L.map('map').setView([40, -3], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OSM'
}).addTo(map);

// Diccionario de colores
const colores = {
  'Permitidas': 'green',
  'Permitidas condicional': 'yellow',
  'Permitidas condicional estricta': 'orange',
  'Prohibidas completamente': 'red'
};
// Estilo dinámico
function style(feature) {
  return {
    color: colores[feature.properties.Labores] || 'gray',
    weight: 1,
    fillOpacity: 0.6
  };
}

// Cargar GeoJSON
fetch('incendios_unificados.geojson')
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      style: style,
      onEachFeature: function (feature, layer) {
        layer.bindPopup(
          `<b>Municipio:</b> ${feature.properties.Municipio}<br>
           <b>Labores:</b> ${feature.properties.Labores}`
        );
      }
    }).addTo(map);
  });
</script>
