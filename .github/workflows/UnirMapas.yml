name: Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # 07:00 Madrid invierno / 08:00 verano
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest 
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python  
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'  
      - name: Debug path
        run: |
          pwd
          ls -R
      - name: Install system dependencies (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas shapely pyproj
          pip install fiona
          pip install geopandas

      - name: Ejecutar pipeline
        run: python Mapas-de-Prevencion-de-incendios/Unificar_SHP_de_incendios.py

      - name: Commit resultados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/
          git diff --staged --quiet || git commit -m "Actualización diaria SHP"
          git push
      
